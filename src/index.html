<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Indian Store - Authentic Indian Marketplace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" />
  <style>
    @keyframes sk-pre-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes sk-pre-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    body { margin: 0; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .sk-pre-box {
      background: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 35%, #f8fafc 50%, #e2e8f0 65%, #f1f5f9 100%);
      background-size: 250% 100%;
      animation: sk-pre-shimmer 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      border-radius: 6px;
    }
    .sk-pre-top-bar { background: #0f172a; height: 34px; display: flex; align-items: center; justify-content: center; }
    .sk-pre-top-pill { width: 220px; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); }
    .sk-pre-nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; max-width: 1400px; margin: 0 auto; box-sizing: border-box; }
    .sk-pre-logo { display: flex; align-items: center; gap: 10px; }
    .sk-pre-logo-icon { width: 36px; height: 36px; border-radius: 8px; }
    .sk-pre-logo-text { width: 140px; height: 20px; border-radius: 4px; }
    .sk-pre-search { flex: 1; max-width: 540px; height: 40px; border-radius: 20px; }
    .sk-pre-actions { display: flex; gap: 12px; }
    .sk-pre-btn { width: 68px; height: 34px; border-radius: 17px; }
    .sk-pre-avatar { width: 36px; height: 36px; border-radius: 50%; }
    .sk-pre-status-wrap { max-width: 1400px; margin: 24px auto 0 auto; padding: 0 24px; display: flex; justify-content: center; box-sizing: border-box; }
    .sk-pre-status-card { background: #ffffff; border: 1px solid #e0f2fe; border-radius: 14px; box-shadow: 0 10px 30px rgba(2, 150, 224, 0.12); padding: 14px 24px; display: inline-flex; align-items: center; gap: 16px; }
    .sk-pre-spinner { width: 24px; height: 24px; border: 3px solid #e0f2fe; border-top-color: #0296e0; border-radius: 50%; animation: sk-pre-spin 0.8s linear infinite; flex-shrink: 0; }
    .sk-pre-info h3 { margin: 0; font-size: 14px; font-weight: 700; color: #0f172a; }
    .sk-pre-info p { margin: 2px 0 0 0; font-size: 12px; color: #0284c7; font-weight: 500; }
    .sk-pre-content { max-width: 1400px; margin: 24px auto; padding: 0 24px; box-sizing: border-box; }
    .sk-pre-hero { height: 220px; border-radius: 16px; margin-bottom: 28px; }
    .sk-pre-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .sk-pre-card { background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; padding: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .sk-pre-card-img { height: 160px; border-radius: 0; }
    .sk-pre-card-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .sk-pre-line { height: 12px; }
    .sk-pre-w40 { width: 40%; }
    .sk-pre-w80 { width: 80%; height: 16px; }
    .sk-pre-w60 { width: 60%; }
  </style>
</head>
<body class="light-theme">
  <app-root>
    <div class="sk-pre-top-bar"><div class="sk-pre-box sk-pre-top-pill"></div></div>
    <header style="background: #fff; border-bottom: 1px solid #e2e8f0;">
      <div class="sk-pre-nav">
        <div class="sk-pre-logo">
          <div class="sk-pre-box sk-pre-logo-icon"></div>
          <div class="sk-pre-box sk-pre-logo-text"></div>
        </div>
        <div class="sk-pre-box sk-pre-search"></div>
        <div class="sk-pre-actions">
          <div class="sk-pre-box sk-pre-btn"></div>
          <div class="sk-pre-box sk-pre-btn"></div>
          <div class="sk-pre-box sk-pre-avatar"></div>
        </div>
      </div>
    </header>
    <div class="sk-pre-status-wrap">
      <div class="sk-pre-status-card">
        <div class="sk-pre-spinner"></div>
        <div class="sk-pre-info">
          <h3>Authenticating with Keycloak...</h3>
          <p>Securing access token and preparing your storefront</p>
        </div>
      </div>
    </div>
    <div class="sk-pre-content">
      <div class="sk-pre-box sk-pre-hero"></div>
      <div class="sk-pre-grid">
        <div class="sk-pre-card">
          <div class="sk-pre-box sk-pre-card-img"></div>
          <div class="sk-pre-card-body">
            <div class="sk-pre-box sk-pre-line sk-pre-w40"></div>
            <div class="sk-pre-box sk-pre-line sk-pre-w80"></div>
            <div class="sk-pre-box sk-pre-line sk-pre-w60"></div>
          </div>
        </div>
        <div class="sk-pre-card">
          <div class="sk-pre-box sk-pre-card-img"></div>
          <div class="sk-pre-card-body">
            <div class="sk-pre-box sk-pre-line sk-pre-w40"></div>
            <div class="sk-pre-box sk-pre-line sk-pre-w80"></div>
            <div class="sk-pre-box sk-pre-line sk-pre-w60"></div>
          </div>
        </div>
        <div class="sk-pre-card">
          <div class="sk-pre-box sk-pre-card-img"></div>
          <div class="sk-pre-card-body">
            <div class="sk-pre-box sk-pre-line sk-pre-w40"></div>
            <div class="sk-pre-box sk-pre-line sk-pre-w80"></div>
            <div class="sk-pre-box sk-pre-line sk-pre-w60"></div>
          </div>
        </div>
        <div class="sk-pre-card">
          <div class="sk-pre-box sk-pre-card-img"></div>
          <div class="sk-pre-card-body">
            <div class="sk-pre-box sk-pre-line sk-pre-w40"></div>
            <div class="sk-pre-box sk-pre-line sk-pre-w80"></div>
            <div class="sk-pre-box sk-pre-line sk-pre-w60"></div>
          </div>
        </div>
      </div>
    </div>
  </app-root>
</body>
</html>
